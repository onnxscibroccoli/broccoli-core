plugins {
    id 'com.android.application'
}

android {
    namespace 'com.accubook.crm'
    compileSdk 35

    defaultConfig {
        applicationId 'com.accubook.crm'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.5.0-dev'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }
}

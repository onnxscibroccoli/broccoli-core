name: build-rdc-supervisor

on:
  push:
    paths:
      - "android/rdc-supervisor/**"
      - ".github/workflows/rdc-supervisor-build.yml"
  pull_request:
    paths:
      - "android/rdc-supervisor/**"
      - ".github/workflows/rdc-supervisor-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/rdc-supervisor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: omnikali-rdc-supervisor-debug
          path: android/rdc-supervisor/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

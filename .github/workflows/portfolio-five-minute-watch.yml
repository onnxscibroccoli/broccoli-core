name: Portfolio Five-Minute Evidence Watch
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/portfolio_watch/**'
      - '.github/workflows/portfolio-five-minute-watch.yml'

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read

concurrency:
  group: portfolio-five-minute-watch-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  public-portfolio-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout source without retained token
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Run fail-closed offline regression tests
        run: |
          PYTHONPATH=. python3 -m unittest discover -s scripts/portfolio_watch/tests -v
      - name: Observe public portfolio state (read-only)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/portfolio_watch/watchdog.py \
            --summary "$GITHUB_STEP_SUMMARY" \
            --json-out portfolio-status.json
      - name: Preserve explicit manual evidence only
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portfolio-status-${{ github.sha }}
          path: portfolio-status.json
          retention-days: 7
          if-no-files-found: error

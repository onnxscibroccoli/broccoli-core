name: Android Debug APK
on:
  push:
    branches:
      - feat/omnikali-android-workstation
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build OmniKali debug APK
        run: gradle --no-daemon -p parallax-android :omnikali:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: omnikali-android-debug-apk
          path: parallax-android/omnikali/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

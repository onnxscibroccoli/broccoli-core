name: Android Debug APK
on:
  push:
    branches:
      - feat/omnikali-android-workstation
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        shell: bash
        run: |
          set -euo pipefail
          echo "${ANDROID_HOME}/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          yes | "${ANDROID_HOME}/cmdline-tools/16.0/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/16.0/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build OmniKali debug APK
        run: gradle --no-daemon -p parallax-android :omnikali:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: omnikali-android-debug-apk
          path: parallax-android/omnikali/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

name: Accubook Android Emulator UI Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - 'feat/accubook-*'
    paths:
      - 'experiments/accubook/android/**'
      - '.github/workflows/accubook-emulator-smoke.yml'
  pull_request:
    paths:
      - 'experiments/accubook/android/**'
      - '.github/workflows/accubook-emulator-smoke.yml'

permissions:
  contents: read

concurrency:
  group: accubook-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  user-flow-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build Accubook debug APK
        working-directory: experiments/accubook/android
        run: gradle :app:assembleDebug --no-daemon
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android emulator functional smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            cd experiments/accubook/android
            bash scripts/emulator-smoke.sh

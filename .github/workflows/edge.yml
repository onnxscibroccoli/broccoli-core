name: edge
on:
  push:
    branches: [main]
    paths:
      - "edge/**"
      - ".github/workflows/edge.yml"
  pull_request:
    paths:
      - "edge/**"
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: install wrangler
        run: npm install -g wrangler@3.80.0
      - name: dry-run (no secrets, no deploy)
        working-directory: edge
        run: |
          set +e
          out="$(npx wrangler deploy --dry-run --outdir=/tmp/broccoli-edge-out 2>&1)"
          status=$?
          printf '%s\n' "$out"
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          # Placeholder account/KV ids are not a bundle failure. Swallowing
          # every error hid invalid worker config. Only auth gaps are skipped.
          if printf '%s\n' "$out" | grep -Eqi "account_id|Not logged in|CLOUDFLARE_API_TOKEN|Authentication error|workers.dev"; then
            echo "Dry-run could not reach Cloudflare. node --check still enforces syntax."
            exit 0
          fi
          exit "$status"
      - name: basic JS sanity
        run: node --check edge/worker.js

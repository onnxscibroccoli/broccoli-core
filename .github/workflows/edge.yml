name: edge
on:
  push:
    branches: [main]
    paths:
      - "edge/**"
      - ".github/workflows/edge.yml"
  pull_request:
    paths:
      - "edge/**"
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: install wrangler
        run: npm install -g wrangler@3.80.0
      - name: dry-run (no secrets, no deploy)
        working-directory: edge
        run: npx wrangler deploy --dry-run --outdir=/tmp/broccoli-edge-out || true
      - name: basic JS sanity
        run: node --check edge/worker.js

name: Build Parallax Distortion APK

on:
  push:
    branches: [ "feat/parallax-distortion-apk", "feat/parallax-acoustic-v2", "main" ]
  workflow_dispatch:
  pull_request:
    paths:
      - "parallax-android/**"
      - ".github/workflows/parallax-android-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Verify debug artifact manifest logic (offline)
        run: python3 -m unittest discover -s parallax-android/scripts/tests -p 'test_verify_debug_artifact.py' -v
      - name: Build debug APK
        working-directory: parallax-android
        run: |
          set +e
          gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
          result=$?
          if [ "$result" -ne 0 ]; then
            report="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
            if [ -f "$report" ]; then
              echo "::group::Full Android Lint report"
              cat "$report"
              echo "::endgroup::"
            fi
          fi
          exit "$result"
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: parallax-android-diagnostics
          path: |
            parallax-android/app/build/reports/lint-results-debug.*
            parallax-android/app/build/reports/tests/**
            parallax-android/app/build/test-results/**
          if-no-files-found: warn
      - name: Verify Android debug APK signature
        run: |
          set -euo pipefail
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$signer"
          "$signer" verify --verbose --print-certs \
            parallax-android/app/build/outputs/apk/debug/app-debug.apk
      - name: Record checksum and source-bound debug manifest
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          apk=parallax-android/app/build/outputs/apk/debug/app-debug.apk
          sums=parallax-android/app/build/outputs/apk/debug/SHA256SUMS.txt
          sha256sum "$apk" > "$sums"
          python3 parallax-android/scripts/verify_debug_artifact.py \
            --apk "$apk" \
            --sums "$sums" \
            --build-script parallax-android/app/build.gradle.kts \
            --source-sha "$SOURCE_SHA" \
            --run-url "$RUN_URL" \
            --out parallax-android/app/build/outputs/apk/debug/DEBUG_BUILD_MANIFEST.json
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: parallax-distortion-debug-apk
          path: |
            parallax-android/app/build/outputs/apk/debug/app-debug.apk
            parallax-android/app/build/outputs/apk/debug/SHA256SUMS.txt
            parallax-android/app/build/outputs/apk/debug/DEBUG_BUILD_MANIFEST.json
          if-no-files-found: error

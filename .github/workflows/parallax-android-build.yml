name: Build Parallax Distortion APK

on:
  push:
    branches: [ "feat/parallax-distortion-apk", "feat/parallax-acoustic-v2", "main" ]
  workflow_dispatch:
  pull_request:
    paths:
      - "parallax-android/**"
      - ".github/workflows/parallax-android-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build debug APK
        working-directory: parallax-android
        run: |
          set +e
          gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
          result=$?
          if [ "$result" -ne 0 ]; then
            report="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
            if [ -f "$report" ]; then
              echo "::group::Full Android Lint report"
              cat "$report"
              echo "::endgroup::"
            fi
          fi
          exit "$result"
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: parallax-android-diagnostics
          path: |
            parallax-android/app/build/reports/lint-results-debug.*
            parallax-android/app/build/reports/tests/**
            parallax-android/app/build/test-results/**
          if-no-files-found: warn
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: parallax-distortion-debug-apk
          path: parallax-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

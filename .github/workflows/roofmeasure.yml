name: RoofMeasure APK, report tests, emulator smoke
on:
  push:
    branches: [feat/roofmeasure-dev]
    paths: ['roofmeasure/**', '.github/workflows/roofmeasure.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: roofmeasure-${{ github.ref }}
  cancel-in-progress: true
env:
  VERSION_CODE: '10706'
  VERSION_NAME: '0.1.7.6'
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK build-tools 34 / platform 34
        run: |
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          [ -d "$ANDROID_HOME/build-tools/34.0.0" ] && [ -d "$ANDROID_HOME/platforms/android-34" ] || yes | "$SDKM" "build-tools;34.0.0" "platforms;android-34" >/dev/null
      - name: Build debug APK (throwaway CI keystore, never committed)
        run: |
          KS="$RUNNER_TEMP/ci-debug.keystore"
          keytool -genkeypair -keystore "$KS" -storepass android -keypass android -alias roofdebug -keyalg RSA -keysize 2048 -validity 30 -dname "CN=RoofMeasure CI Debug" >/dev/null 2>&1
          KEYSTORE="$KS" bash roofmeasure/build.sh "$RUNNER_TEMP/apk"
          rm -f "$RUNNER_TEMP/apk/classes.dex"
          $ANDROID_HOME/build-tools/34.0.0/aapt2 dump badging "$RUNNER_TEMP/apk/"*.apk | head -3
          ls -l "$RUNNER_TEMP/apk"
      - uses: actions/upload-artifact@v4
        with:
          name: roofmeasure-apk
          path: ${{ runner.temp }}/apk/
          retention-days: 14
  report-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-playwright-core-1.59.1
      - name: Install playwright-core (uses the runner's Google Chrome)
        run: mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw" && npm init -y >/dev/null && npm i --no-audit --no-fund playwright-core@1.59.1 >/dev/null
      - name: Headless report tests (15 Ward St Hingham, 6 Harborview Hull, 30 Lockwood Weymouth, 49 Scotland Hingham; ortho align; 3-D editor; Hull geocode; per-facet on/off; tile failure; editor)
        env:
          PW: ${{ runner.temp }}/pw/node_modules/playwright-core
          CHROME: /usr/bin/google-chrome
        run: node roofmeasure/tests/v0176_test.cjs "$RUNNER_TEMP/report-out"
      - name: Fail on page errors / missing aerial
        run: |
          python3 - "$RUNNER_TEMP/report-out/v0176_test.json" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1])); bad = []
          for k, h in r["houses"].items():
              if h.get("errors"): bad.append(f"{k}: page errors {h['errors'][:2]}")
              for m in ("pf_off", "pf_on"):
                  x = h.get(m, {}).get("html", {})
                  if x.get("aerial_missing") or x.get("fullpages") != 4: bad.append(f"{k} {m}: aerial/full pages {x}")
              oa = h.get("pf_off", {}).get("ortho") or {}
              if oa.get("status") != "ok": bad.append(f"{k}: ortho align {oa}")
              v = h.get("view3d") or {}
              if v.get("error") or not (v.get("edit") or {}).get("edits_3d") or not v.get("report_mentions_edit"): bad.append(f"{k}: 3-D editor {str(v)[:300]}")
              x = h.get("pf_off", {}); f = x.get("features") or {}; c = f.get("counts") or {}
              if k == "15_ward_st_hingham":
                  if ((x.get("model_fit") or {}).get("median_ft") or 9) > 0.2: bad.append(f"15 Ward lidar residual regressed: {x.get('model_fit')}")
                  if not 2 <= (c.get("skylights") or 0) <= 4: bad.append(f"15 Ward skylight count {c}")
              if k == "6_harborview_rd_hull" and not any(150 <= (d[0] or 0) <= 210 for d in f.get("decks") or []): bad.append(f"6 Harborview deck area {f.get('decks')}")
          for g in r["hull_geocode"][:2]:
              if g["result"] or "not found in HULL" not in g["status"]: bad.append(f"Hull geocode should be not-found: {g}")
          if not r["hull_geocode"][2]["result"]: bad.append(f"6 Harborview Hull not found: {r['hull_geocode'][2]}")
          for run in r["tile_failure"]["runs"]:
              if run["missing"] or not run["has_aerial_svg"]: bad.append(f"tile failure run {run}")
          print("\n".join(bad) or "report tests OK"); sys.exit(1 if bad else 0)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roofmeasure-report-tests
          path: ${{ runner.temp }}/report-out/
          retention-days: 14
  benchmark-oakcrest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        num: ['1', '2', '3', '4', '5', '6']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-playwright-core-1.59.1
      - name: Install playwright-core
        run: mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw" && npm init -y >/dev/null && npm i --no-audit --no-fund playwright-core@1.59.1 >/dev/null
      - name: Report for ${{ matrix.num }} Oakcrest Rd, Hingham
        env:
          PW: ${{ runner.temp }}/pw/node_modules/playwright-core
          CHROME: /usr/bin/google-chrome
          RM_ONLY_HOUSES: '1'
          RM_HOUSES: '[{"slug":"${{ matrix.num }}_oakcrest_rd_hingham","addr":"${{ matrix.num }} Oakcrest Road, Hingham, MA 02043"}]'
        run: node roofmeasure/tests/v0176_test.cjs "$RUNNER_TEMP/bench-out"
      - name: Summary
        if: always()
        run: |
          python3 - "$RUNNER_TEMP/bench-out/v0176_test.json" <<'PY' | tee "$RUNNER_TEMP/bench-out/summary.txt"
          import json, sys
          r = json.load(open(sys.argv[1]))
          for k, h in r["houses"].items():
              x = h.get("pf_off", {}); f = x.get("features") or {}
              print(k, "roof", x.get("roof"), "sq", x.get("squares"), "pitch", x.get("pitch"), "eave", x.get("eave"), "rake", x.get("rake_sloped"),
                    "model", x.get("model"), "counts", f.get("counts"), "skylights", f.get("skylights"), "decks", f.get("decks"), "dormers", f.get("dormers"),
                    "lidar_outline", {k: (x.get("lidar_outline") or {}).get(k) for k in ("dx_m", "dy_m", "iou0", "iou", "applied", "outside_area_sqft")}, "ortho", {k: (x.get("ortho") or {}).get(k) for k in ("dx_m", "dy_m", "confidence")}, "errors", h.get("errors"))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-oakcrest-${{ matrix.num }}
          path: ${{ runner.temp }}/bench-out/
          retention-days: 14
  emulator-smoke:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@v4
        with:
          name: roofmeasure-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-google_apis-x86_64-v1
      - name: Create AVD snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "AVD snapshot created"
      - name: Install, launch, generate report, save PDF
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash roofmeasure/tests/ci_emulator_smoke.sh "$(ls apk/*.apk | head -1)" smoke-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roofmeasure-emulator-smoke
          path: smoke-out/
          retention-days: 14

# Broccoli Edge Worker — wrangler.toml
# Deploy: cd edge && npx wrangler deploy
# Free tier: 100k req/day, 10ms CPU, 128MB mem, 50 subrequests/req.

name = "broccoli-edge"
main = "worker.js"
compatibility_date = "2026-09-01"
account_id = ""  # set via `wrangler login` or CLOUDFLARE_ACCOUNT_ID env

[vars]
ENVIRONMENT = "production"

# KV namespace for encrypted record storage + trial history
[[kv_namespaces]]
binding = "KV_NS"
id = "REPLACE_WITH_KV_ID"
preview_id = "REPLACE_WITH_PREVIEW_KV_ID"

# D1 database for cold metadata (daily limits enforced since 2026-09-01)
[[d1_databases]]
binding = "D1_DB"
database_name = "broccoli-meta"
database_id = "REPLACE_WITH_D1_ID"

# Vectorize index for semantic search (5M stored dims free)
[[vectorize]]
binding = "VECTORIZE"
index_name = "broccoli-vectors"

# Workers AI for embeddings + tiny classification (10k neurons/day free)
[ai]
binding = "AI"

; OmniKali Termux service supervision
; Template only. Install and activate only after live device validation.

[unix_http_server]
file=%(ENV_HOME)s/.omnikali/rdc-supervisor/supervisord.sock
chmod=0600

[supervisord]
logfile=%(ENV_HOME)s/.omnikali/rdc-supervisor/supervisord.log
pidfile=%(ENV_HOME)s/.omnikali/rdc-supervisor/supervisord.pid
nodaemon=false
loglevel=info
minfds=64

[program:rdc-remote]
directory=%(ENV_HOME)s
command=/data/data/com.termux/files/usr/bin/bash -lc 'exec npx --yes @wonderwhy-er/desktop-commander@latest remote'
autostart=true
autorestart=true
startsecs=8
startretries=5
stopsignal=TERM
stopwaitsecs=15
redirect_stderr=true
stdout_logfile=%(ENV_HOME)s/.omnikali/rdc-supervisor/rdc.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
environment=HOME="%(ENV_HOME)s"

; Add a health command only after the positive RDC heartbeat contract exists.

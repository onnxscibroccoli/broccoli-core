; Optional automation services. Keep disabled until their live contracts pass.

[program:appium-server]
directory=%(ENV_HOME)s
command=/data/data/com.termux/files/usr/bin/bash -lc 'exec $HOME/broccoli-core/tools/automation/appium-server.sh'
autostart=false
autorestart=true
startsecs=8
startretries=3
stopsignal=TERM
stopwaitsecs=15
redirect_stderr=true
stdout_logfile=%(ENV_HOME)s/.omnikali/rdc-supervisor/appium.log
environment=HOME="%(ENV_HOME)s",APPIUM_PORT="4723"

; Playwright and RUTO are task-oriented and must not be made permanent daemons.
; Invoke their wrappers as bounded jobs through the same supervisor/job API.
